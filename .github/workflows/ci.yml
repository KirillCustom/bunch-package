name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Патчи применяются своим кодом, но платформы расходятся в мелочах:
    # переводы строк, разделители путей, права на файлы. Поэтому все три.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Локфайл лежит в репозитории, поэтому --frozen-lockfile значит то, что
      # обещает: версии не разрешаются заново на каждом прогоне. Пока его не
      # было, молчаливое обновление typescript в реестре могло уронить CI
      # новыми ошибками типов — без единого изменения в коде.
      - run: bun install --frozen-lockfile

      # tsc ловит то, чего не ловят ни тесты, ни корпус: bun исполняет
      # TypeScript, но типы не проверяет. Вызов потерянной функции прожил из-за
      # этого три релиза.
      - run: bun run typecheck

      - run: bun test

      - run: bun run build

  # `engines` обещает bun >= 1.0.0, и до этой проверки обещание было неправдой:
  # на 1.1 `apply` падал с EEXIST на mkdir существующего node_modules. Сюиту на
  # старых bun не прогнать (текстовый локфайл и test runner появились в 1.2),
  # поэтому здесь — короткий прогон самого инструмента, без установки
  # зависимостей: apply, повторный apply, status, откат и edit.
  old-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.0.36', '1.1.45', '1.2.23']

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: apply, re-apply, status, rebase and edit
        run: |
          set -e
          bun --version
          mkdir -p demo/node_modules/fakepkg demo/patches
          cd demo
          echo '{"name":"demo","version":"1.0.0"}' > package.json
          echo '{"name":"fakepkg","version":"1.0.0"}' > node_modules/fakepkg/package.json
          printf 'line one\nline two\n' > node_modules/fakepkg/index.js
          printf -- '--- a/node_modules/fakepkg/index.js\n+++ b/node_modules/fakepkg/index.js\n@@ -1,2 +1,2 @@\n-line one\n+PATCHED\n line two\n' > patches/fakepkg+1.0.0.patch

          bun ../index.ts apply
          grep -q '^PATCHED$' node_modules/fakepkg/index.js

          bun ../index.ts apply | grep -q 'already applied'
          bun ../index.ts status | grep -q '1 of 1 in the tree'

          bun ../index.ts rebase fakepkg 0
          grep -q '^line one$' node_modules/fakepkg/index.js

          # edit разрывает hardlink на общий кеш — то, ради чего команда и есть.
          # На старых bun проверяется не логика, а что readdir/stat/realpath
          # ведут себя там так же: обещание engines касается и этой команды.
          ln node_modules/fakepkg/index.js cache-entry.js
          bun ../index.ts edit fakepkg | grep -q 'Detached'
          test "$(stat -c %i node_modules/fakepkg/index.js)" != "$(stat -c %i cache-entry.js)"
          grep -q '^line one$' node_modules/fakepkg/index.js

          # upstream: без repository — внятный отказ, не стек.
          bun ../index.ts upstream fakepkg 2>&1 | grep -q 'repository'

          # fold: без последовательности схлопывать нечего — отказ, а не стек.
          bun ../index.ts fold fakepkg 2>&1 | grep -q 'nothing to fold'

          # export: патч переименовывается в формат bun и записывается patchedDependencies.
          bun ../index.ts export
          test -f patches/fakepkg@1.0.0.patch
          grep -q 'fakepkg@1.0.0' package.json
